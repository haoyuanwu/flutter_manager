name: Release macOS DMG

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    defaults:
      run:
        working-directory: fvm_manager
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: fvm_manager/mcp_server/package-lock.json
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Build bundled MCP server
        run: |
          npm ci --prefix mcp_server
          npm run build --prefix mcp_server
          npm run bundle --prefix mcp_server
      - name: Resolve dependencies and test
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/tests
          flutter pub get
          flutter test --no-pub
      - name: Check tag and application version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="$(sed -n 's/^version: \([^+]*\).*/\1/p' pubspec.yaml)"
          test "$RELEASE_TAG" = "v$version"
      - name: Build macOS release
        run: flutter build macos --release --no-pub
      - name: Package DMG
        run: python3 scripts/package_macos_release.py
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --notes-file "RELEASE_NOTES_$RELEASE_TAG.md" build/release/*.dmg build/release/SHA256SUMS.txt
      - name: Verify published release and downloads
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/verify_github_release.py
