name: Release macOS DMG

on:
  push:
    tags:
      - 'v1.2.6'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    defaults:
      run:
        working-directory: fvm_manager
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: fvm_manager/mcp_server/package-lock.json
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - name: Build bundled MCP server
        run: |
          npm ci --prefix mcp_server
          npm run build --prefix mcp_server
          npm run bundle --prefix mcp_server
      - name: Resolve dependencies and test
        run: |
          flutter pub get
          flutter test --no-pub
      - name: Build macOS release
        run: flutter build macos --release --no-pub
      - name: Package DMG
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir -p build/release
          staging_dir="$(mktemp -d)"
          ditto 'build/macos/Build/Products/Release/Flutter Manager.app' "$staging_dir/Flutter Manager.app"
          ln -s /Applications "$staging_dir/Applications"
          hdiutil create -volname 'Flutter Manager' -srcfolder "$staging_dir" -ov -format UDZO "build/release/FlutterManager-$RELEASE_TAG.dmg"
          hdiutil verify "build/release/FlutterManager-$RELEASE_TAG.dmg"
          cd build/release
          shasum -a 256 "FlutterManager-$RELEASE_TAG.dmg" > SHA256SUMS.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --notes-file RELEASE_NOTES_v1.2.6.md "build/release/FlutterManager-$RELEASE_TAG.dmg" build/release/SHA256SUMS.txt
